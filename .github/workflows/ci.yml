name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned Web Platform Tests
        uses: actions/checkout@v4
        with:
          repository: web-platform-tests/wpt
          ref: fbc1b90e28b38e919acabeeb14d1b074f2c125ec
          path: target/wpt
          fetch-depth: 1
          sparse-checkout: |
            resources
            webaudio/resources
            webaudio/the-audio-api/the-audiobuffer-interface
            webaudio/the-audio-api/the-audionode-interface
            webaudio/the-audio-api/the-gainnode-interface
            webaudio/the-audio-api/the-offlineaudiocontext-interface
            webaudio/the-audio-api/the-oscillatornode-interface
      - uses: dtolnay/rust-toolchain@1.91.0
      - name: Install Linux audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev
      - run: cargo check --all-targets --locked
      - run: cargo test --all-targets --locked
      - run: cargo test --all-targets --no-default-features --locked
        env:
          DENO_AUDIO_WPT_ROOT: target/wpt
      - name: Run pinned Web Platform Test subset
        run: cargo test --test wpt --no-default-features --locked -- --nocapture
        env:
          DENO_AUDIO_WPT_ROOT: target/wpt
      - run: cargo test --doc --locked
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  lint:
    name: Lint and package audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: clippy, rustfmt
      - name: Install Linux audio headers
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo package --list

  msrv:
    name: Rust 1.91
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - name: Install Linux audio headers
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev
      - run: cargo check --all-targets --locked

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check
