[graph]
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
]

[advisories]
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "The pinned Deno/V8 tuple transitively uses paste 1.0.15; this is a maintenance-status advisory with no known vulnerability and no compatible replacement inside the tuple." },
  { id = "RUSTSEC-2025-0141", reason = "The pinned Deno tuple transitively uses bincode 1.3.3; this is a maintenance-status advisory with no known vulnerability and no compatible replacement inside the tuple." },
]

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Functional releases are intentionally Git-only. The package is private to
# registries (`publish = false`), and its exact-revision Git dependency has no
# registry version for Cargo to preserve in a package archive.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/smudgy-mud/web-audio-api-rs"]
